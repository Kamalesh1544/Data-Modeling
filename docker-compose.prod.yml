version: '3.9'

services:
  redis:
    image: redis
    restart: always
    container_name: redis
    ports:
      - "6379:6379"

  db:
    image: postgres
    container_name: database
    restart: always
    env_file: .env
    volumes:
      - postgres_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    container_name: backend
    command: >
      sh -c "uvicorn app.main:app"
    restart: always
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db

  celery:
    restart: always
    container_name: celery
    build:
      context: .
    command: sh -c "celery -A recruit worker --concurrency=2 -l info -Q normalQueue"
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
      - backend

#  celerybeat:
#    restart: always
#    container_name: celerybeat
#    build:
#      context: .
#    command: sh -c "celery -A recruit beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
#    env_file: .env
#    volumes:
#      - .:/app
#    depends_on:
#      - redis
#      - db
#      - backend

  flower:
    image: mher/flower
    restart: always
    container_name: flower
    env_file: .env
    depends_on:
      - redis
      - backend
      - celery
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/
      - FLOWER_PORT=5555
      - FLOWER_PERSISTENT=True
    ports:
      - "5555:5555"

    volumes:
      - flower-data:/var/

  pgadmin:
    container_name: pgadmin4
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    volumes:
      - my-data:/data


# create global to save database
# on same location
volumes:
  postgres_db:
  neo4j:
  my-data:
  flower-data: